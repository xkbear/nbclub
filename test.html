<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NewBee AI Club｜桌面排版试改</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f2ede2;
    }

    #site-preview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f2ede2;
    }
  </style>
</head>
<body>
  <iframe
    id="site-preview"
    src="./index.html?layout-preview=test-v1"
    title="NewBee AI Club 桌面排版试改页面"
  ></iframe>

  <script>
    const preview = document.getElementById('site-preview');

    preview.addEventListener('load', () => {
      const page = preview.contentDocument;
      if (!page || page.documentElement.dataset.testLayoutApplied === 'true') return;

      page.documentElement.dataset.testLayoutApplied = 'true';
      page.title = 'NewBee AI Club｜桌面排版试改';

      const robots = page.querySelector('meta[name="robots"]');
      if (robots) robots.setAttribute('content', 'noindex, nofollow');

      const testStyle = page.createElement('style');
      testStyle.id = 'test-layout-overrides';
      testStyle.textContent = `
        /* TEST V1：只调整桌面比例，手机端沿用当前正式首页。 */
        @media (min-width: 981px) {
          body {
            background:
              radial-gradient(circle at 8% 18%, rgba(201, 168, 76, .08), transparent 28%),
              linear-gradient(180deg, #f7f3eb 0%, #eee8da 100%);
          }

          .cover.cover-home.home-carousel-hero {
            height: min(760px, 82svh);
            min-height: 640px;
            max-height: 760px;
            grid-template-columns: minmax(340px, .78fr) minmax(560px, 1.22fr);
            gap: clamp(2rem, 3vw, 4rem);
            padding: clamp(2.1rem, 3.2vw, 3.7rem);
          }

          .home-intro .cover-brand {
            font-size: clamp(2.35rem, 3vw, 3.45rem);
          }

          .cover-home .home-event-panel {
            min-height: clamp(460px, 58svh, 560px);
            height: clamp(460px, 58svh, 560px);
          }

          .content {
            max-width: 1180px;
            padding: 4.5rem clamp(4rem, 6vw, 6.5rem) 5.5rem;
            border-left: 1px solid rgba(139, 115, 85, .12);
            border-right: 1px solid rgba(139, 115, 85, .12);
            box-shadow: 0 30px 90px rgba(62, 49, 32, .08);
          }

          .content > h1,
          .content > h2,
          .content > h3,
          .content > p,
          .content > ul,
          .content > ol,
          .content > .quote-block,
          .content > .highlight-box {
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
          }

          h1 {
            font-size: 2rem;
            line-height: 1.3;
            margin-top: 3.75rem;
            padding-bottom: .75rem;
          }

          h2 {
            font-size: 1.42rem;
            line-height: 1.45;
            margin-top: 2.35rem;
          }

          h3,
          .benefit-title {
            font-size: 1.12rem;
          }

          p,
          li {
            font-size: 1.02rem;
            line-height: 1.9;
          }

          .founders,
          .benefit-table-wrap,
          .org-chart,
          .local-discovery,
          .faq {
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
          }

          .founders {
            padding: 2rem 2.2rem 1.7rem;
            border-radius: 10px;
          }

          .benefit-title {
            margin-top: 1.75rem;
          }

          .benefit-table {
            font-size: 1rem;
          }

          .benefit-table th {
            font-size: .96rem;
          }

          .faq details {
            padding: .15rem 0;
          }

          .faq summary {
            font-size: 1.08rem;
          }
        }

        .membership-closed {
          display: inline-flex;
          align-items: center;
          margin-left: .6rem;
          padding: .22rem .58rem;
          border: 1px solid rgba(139, 115, 85, .35);
          border-radius: 999px;
          color: var(--gold);
          background: rgba(139, 115, 85, .06);
          font: 700 .68rem/1.2 Arial, sans-serif;
          letter-spacing: 1px;
          vertical-align: middle;
          white-space: nowrap;
        }

        .membership-rights-note {
          margin-top: .35rem !important;
        }

        .org-chart .oc-member-row {
          gap: 16px;
          flex-wrap: wrap;
          align-items: stretch;
        }

        .org-chart .oc-nm {
          min-width: 210px;
          padding: 16px 32px;
        }

        .org-chart .oc-nm.oc-founding-member {
          border-color: rgba(201, 168, 76, .9);
          background: linear-gradient(135deg, #fffaf0 0%, #f4ead2 100%);
          box-shadow: 0 8px 24px rgba(139, 115, 85, .12);
        }

        .org-chart .oc-nm.oc-founding-member .oc-nm-role,
        .org-chart .oc-nm.oc-founding-member .oc-nm-price {
          color: var(--gold);
        }

        @media (max-width: 480px) {
          .org-chart .oc-member-row { gap: 8px; }
          .org-chart .oc-nm {
            flex: 1 1 130px;
            min-width: 130px;
            padding: 12px 8px;
          }
          .org-chart .oc-nm-name { font-size: 14px; }
        }
      `;
      page.head.appendChild(testStyle);

      const joinButton = page.querySelector('.join-btn');
      if (joinButton) {
        joinButton.textContent = '会员权益';
        joinButton.setAttribute('href', '#s6');
        joinButton.removeAttribute('target');
      }

      const membershipHeading = [...page.querySelectorAll('.content > h2')]
        .find((heading) => heading.textContent.includes('创始会员权益'));

      if (membershipHeading) {
        membershipHeading.textContent = '4）会员权益';
        const status = page.createElement('span');
        status.className = 'membership-closed';
        status.textContent = '首期 26 席已于 6 月 30 日截止';
        membershipHeading.appendChild(status);

        const intro = membershipHeading.nextElementSibling;
        if (intro && intro.tagName === 'P') {
          intro.textContent = '首期 26 席创始会员招募已于 2026 年 6 月 30 日截止。';
          const rightsNote = page.createElement('p');
          rightsNote.className = 'membership-rights-note';
          rightsNote.textContent = '以下为俱乐部所有会员权益；后续会员计划将在现有会员稳定参与并形成共识后另行公布。';
          intro.insertAdjacentElement('afterend', rightsNote);
        }
      }

      const memberRow = page.querySelector('.org-chart .oc-member-row');
      if (memberRow) {
        memberRow.innerHTML = `
          <div class="oc-nm oc-founding-member">
            <div class="oc-nm-role">Founding Member</div>
            <div class="oc-nm-name">创始会员</div>
            <div class="oc-nm-price">1,999 NZD / 年</div>
          </div>
          <div class="oc-nm">
            <div class="oc-nm-role">Member</div>
            <div class="oc-nm-name">会员</div>
            <div class="oc-nm-price">1,299 NZD / 年</div>
          </div>
        `;
      }

      const consultationTitle = [...page.querySelectorAll('.benefit-title')]
        .find((title) => title.textContent.includes('品哥定向咨询'));

      if (consultationTitle) {
        const titleText = consultationTitle.querySelector('strong');
        if (titleText) titleText.textContent = '品哥 + AI Master 日常答疑';

        const consultationBody = consultationTitle.nextElementSibling;
        if (consultationBody && consultationBody.tagName === 'P') {
          consultationBody.innerHTML = '会员可在俱乐部日常交流中获得<strong>品哥与 AI Master 的答疑支持</strong>，围绕 AI 学习、工具使用及家庭或企业场景中的实际问题进行交流。';
        }

        const priceNote = consultationBody?.nextElementSibling;
        if (priceNote?.classList.contains('benefit-note')) priceNote.remove();
      }

      const consultationRow = [...page.querySelectorAll('.benefit-table tbody tr')]
        .find((row) => row.textContent.includes('创始会员定向咨询'));

      if (consultationRow) {
        const cells = consultationRow.querySelectorAll('td');
        if (cells.length >= 4) {
          cells[0].textContent = '日常答疑';
          cells[1].textContent = '品哥 + AI Master';
          cells[2].textContent = '日常';
          cells[3].textContent = '持续获得实际问题支持';
        }
      }

      const faqItems = [...page.querySelectorAll('.faq details')];
      const seoQuestion = faqItems.find((item) =>
        item.querySelector('summary')?.textContent.includes('新西兰有哪些面向华人的 AI 俱乐部')
      );
      if (seoQuestion) seoQuestion.remove();

      const joiningQuestion = [...page.querySelectorAll('.faq details')].find((item) =>
        item.querySelector('summary')?.textContent.includes('如何申请加入先蜂AI俱乐部')
      );

      if (joiningQuestion) {
        joiningQuestion.querySelector('summary').textContent = '目前如何了解后续会员计划？';
        const answer = joiningQuestion.querySelector('.faq-a');
        if (answer) {
          answer.innerHTML = '首期 26 席创始会员招募已于 2026 年 6 月 30 日截止。后续会员安排将在创始会员稳定参与并形成共识后公布。如希望了解下一期计划，可通过 <a href="mailto:office@new-bee.club" style="color:var(--gold);">office@new-bee.club</a> 联系俱乐部。';
        }
      }

      const benefitsQuestion = [...page.querySelectorAll('.faq details')].find((item) =>
        item.querySelector('summary')?.textContent.includes('创始会员有哪些权益')
      );

      if (benefitsQuestion) {
        benefitsQuestion.querySelector('summary').textContent = '会员有哪些权益？';
        const answer = benefitsQuestion.querySelector('.faq-a');
        if (answer) {
          answer.textContent = '会员核心五件套：① 行业定制新闻简报（每工作日 AI 生成）；② 会员专属 AI 私教 Agent（内置小龙虾、Hermes、GEO 诊断等工具）；③ Starmesh 平台 20 人以下免费使用权；④ 月度讲座与实操工作坊（每月至少一次）；⑤ 品哥 + AI Master 日常答疑。';
        }
      }
    });
  </script>
</body>
</html>
