{% load static %}<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>{% block title %}数据看板{% endblock %} · NewBee AI Club</title>
  <link rel="icon" type="image/png" href="{% static 'stats/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'stats/dashboard.css' %}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar">
<div class="topbar-inner">
<a class="brand" href="{% url 'dashboard' %}">
<img class="brand-logo" src="{% static 'stats/newbee-logo.png' %}" alt="NewBee AI Club" width="91" height="37">
<span>NewBee <strong>数据中心</strong>
</span>
</a>{% if user.is_authenticated %}<div class="user-actions">
<span>内部访问</span>
<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit" class="text-button">退出</button>
</form>
</div>{% endif %}</div>
</header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="footer">NewBee AI Club · 内部数据 · 所有日期按北京时间</footer>
</body>
</html>
