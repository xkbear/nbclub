{% extends 'stats/base.html' %}
{% block title %}登录{% endblock %}
{% block content %}<section class="login-shell">
<div class="login-card">
<div class="eyebrow">PRIVATE DASHBOARD</div>
<h1>查看 NewBee 数据</h1>
<p>仅供已授权的团队成员访问。</p>{% if form.errors %}<p class="form-error">账号或密码不正确。</p>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">账号</label>
<input id="id_username" name="username" autocomplete="username" required autofocus>
<label for="id_password">密码</label>
<input id="id_password" type="password" name="password" autocomplete="current-password" required>
<input type="hidden" name="next" value="{{ next }}">
<button type="submit" class="primary-button">登录看板 <span aria-hidden="true">↗</span>
</button>
</form>
</div>
</section>
{% endblock %}
