{% extends 'stats/base.html' %}
{% block title %}登录{% endblock %}
{% block content %}<section class="login-shell">
<div class="login-card">
{% load static %}<img class="login-logo" src="{% static 'stats/newbee-logo.png' %}" alt="NewBee AI Club" width="118" height="48">
<div class="eyebrow">PRIVATE DASHBOARD</div>
<h1>查看 NewBee 数据</h1>
<p>输入团队共享密码即可查看。</p>{% if form.errors %}<p class="form-error">密码不正确。</p>{% endif %}<form method="post">{% csrf_token %}<label for="id_password">访问密码</label>
<input id="id_password" type="password" name="password" autocomplete="current-password" required autofocus>
<input type="hidden" name="next" value="{{ next }}">
<button type="submit" class="primary-button">登录看板 <span aria-hidden="true">↗</span>
</button>
</form>
</div>
</section>
{% endblock %}
