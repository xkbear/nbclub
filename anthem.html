  body {

  }

  /* 顶部导航回链 */

  .back:hover { color: var(--gold-soft); }

  /* 标题区 */
  .head { text-align: center; margin-bottom: 2.2rem; }
  .head .tag {
    font-family: "Arial", sans-serif;

  }

  /* 视频容器 */
  .stage {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 2 / 1;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    box-shadow:
      0 0 0 1px rgba(201,168,76,.25),
      0 24px 80px rgba(0,0,0,.6),
      0 0 120px rgba(201,168,76,.08);
    cursor: pointer;
  }
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .stage .veil {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.1) 40%, rgba(0,0,0,.55) 100%),
      url('assets/anthem-lyrics-poster.webp') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .8s ease;
  }
  .stage.playing .veil { opacity: 0; pointer-events: none; }

  .play {
    position: relative;
    width: 110px;
    height: 110px;
    border: none;
    background: none;
    color: var(--gold);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .3s ease, color .3s ease;
  }
  .play::before, .play::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    opacity: .55;
    animation: pulse 2.4s ease-out infinite;
  }
  .play::after { animation-delay: 1.2s; }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: .55; }
    70%  { transform: scale(1.55); opacity: 0; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .play svg {
    width: 70px; height: 70px;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.5));
  }
  .play:hover { transform: scale(1.06); color: var(--gold-soft); }

  /* 视频下方提示 */
  .hint {
    margin-top: 1.6rem;
    font-size: .85rem;
    letter-spacing: 4px;
    color: rgba(255,255,255,.55);
    font-family: "Arial", sans-serif;
  }
  .pause-tip {
    position: absolute;
    bottom: .8rem;
    right: 1rem;
    z-index: 3;
    font-size: .7rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,.65);

    padding: .25rem .55rem;
    border-radius: 3px;
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
  }
  .stage.playing .pause-tip { opacity: 1; }

<div class="head">
  <div class="tag">CLUB ANTHEM · 先蜂会歌</div>
  <h1>AI 时代为我而创</h1>
  <div class="sub">为这个时代，留下我们自己的声音</div>
</div>

<div class="stage" id="stage">
  <video id="v" preload="metadata" playsinline poster="assets/anthem-lyrics-poster.webp">
    <source src="assets/anthem-lyrics.mp4" type="video/mp4">
  </video>
  <div class="veil">
    <button class="play" id="play" type="button" aria-label="播放会歌">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="22,16 50,32 22,48" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <div class="pause-tip">点击画面暂停</div>
</div>

<div class="hint">点击画面播放 · 再次点击暂停</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var v = document.getElementById('v');
  var btn = document.getElementById('play');
  function play(){
    stage.classList.add('playing');
    v.muted = false;
    var p = v.play();
    if (p && p.catch) p.catch(function(){ v.muted = true; v.play(); });
  }
  function toggle(){
    if (stage.classList.contains('playing')) {
      v.pause();
      stage.classList.remove('playing');
    } else {
      play();
    }
  }
  stage.addEventListener('click', toggle);
  btn.addEventListener('click', function(e){ e.stopPropagation(); play(); });
  v.addEventListener('ended', function(){
    stage.classList.remove('playing');
    v.currentTime = 0;
  });
})();
</script>
